[project]
name = "ha-zero-inject-3erl"
version = "0.1.0"
description = "Home Assistant custom integration for 3ERL zero-injection curtailment."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.9.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "ha-zero-inject-3erl"
version = "0.2.0"
description = "Home Assistant custom integration for 3ERL zero-injection curtailment."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.9.3",
]

[tool.uv]
# homeassistant pins pillow==12.3.0 which carries ~30 open Dependabot
# advisories fixed in 13.0.0. Pillow is only needed for the test
# environment (image platforms); the integration itself does not use it.
override-dependencies = ["pillow>=13.0.0"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "ruff>=0.6.0",
]

[tool.ruff]
# Match requires-python (HA 2026.9+ requires Python 3.14); PEP 758 bare
# exception tuples are the canonical 3.14 style applied by ruff format.
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "BLE",
    "E",
    "F",
    "I",
    "N",
    "S",
    "W",
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain assert statements.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

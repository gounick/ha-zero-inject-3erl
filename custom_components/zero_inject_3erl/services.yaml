set_bypass:
  fields:
    enable:
      required: false
      default: true
      selector:
        boolean:
    duration:
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
set_mode:
  fields:
    mode:
      required: true
      selector:
        select:
          options:
            - "Auto"
            - "On"
            - "Off"
    duration:
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box

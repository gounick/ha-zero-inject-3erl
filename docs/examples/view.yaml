# Lovelace view for the 3ERL Zero-Injection integration.
#
# Paste this as a new view in a Lovelace dashboard. Entity IDs below match a
# fresh install (device name "3ERL Zero-Injection"); adapt them if you renamed
# entities, and replace the relay entity with your own switch.

path: 3erl-zero-injection
title: 3ERL Zero-Injection
icon: mdi:solar-power
type: sections
max_columns: 3
sections:
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: 3ERL Zero-Injection
        icon: mdi:solar-power

      # Status row
      - type: tile
        entity: select.3erl_zero_injection_zero_injection_mode
        name: Mode
        features:
          - type: select-options
      - type: tile
        entity: binary_sensor.3erl_zero_injection_curtailment_requested
        name: Curtailment requested
        # ACC contract? Use binary_sensor.3erl_zero_injection_cdc_curtailment_requested
        state_content:
          - state
          - last_changed
      - type: tile
        entity: binary_sensor.3erl_zero_injection_zero_injection_active
        name: Zero-injection active
        state_content:
          - state
          - last_changed
      - type: tile
        entity: binary_sensor.3erl_zero_injection_3erl_data_stale
        name: Data freshness
        state_content: state

      # Live figures
      - type: tile
        entity: sensor.3erl_zero_injection_curtailable_power
        name: Curtailable power
      - type: tile
        entity: sensor.3erl_zero_injection_current_pre
        name: Current PRE+
        # ACI contract? Use sensor.3erl_zero_injection_estimated_daily_pre
      - type: tile
        entity: sensor.3erl_zero_injection_gain_rate
        name: Estimated hourly gain
      - type: tile
        entity: sensor.3erl_zero_injection_daily_trend
        name: Daily trend

      # Totals
      - type: tile
        entity: sensor.3erl_zero_injection_curtailed_energy
        name: Curtailed energy
      - type: tile
        entity: sensor.3erl_zero_injection_cumulative_gain
        name: Cumulative gain
      - type: tile
        entity: switch.your_relay_switch
        name: Relay
        # <-- replace with your relay switch entity

  - type: grid
    column_span: 2
    cards:
      - type: history-graph
        title: Curtailment — last 24 h
        hours_to_show: 24
        entities:
          - entity: binary_sensor.3erl_zero_injection_curtailment_requested
            name: Requested
          - entity: binary_sensor.3erl_zero_injection_zero_injection_active
            name: Active
      - type: statistics-graph
        title: Curtailed energy and gain
        days_to_show: 30
        chart_type: bar
        stat_types:
          - change
        entities:
          - sensor.3erl_zero_injection_curtailed_energy
          - sensor.3erl_zero_injection_cumulative_gain

  - type: grid
    cards:
      - type: history-graph
        title: PRE+ — last 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.3erl_zero_injection_current_pre
            name: Current
          - entity: sensor.3erl_zero_injection_latest_pre
            name: Latest (3ERL)
      - type: history-graph
        title: Curtailable power — last 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.3erl_zero_injection_curtailable_power
            name: Power (W)

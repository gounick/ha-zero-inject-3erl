# Lovelace view for the 3ERL Zero-Injection integration.
#
# Paste this as a new view in a Lovelace dashboard. Entity IDs below match a
# fresh install (device name "3ERL Zero-Injection"); adapt them if you renamed
# entities, and replace the relay entity with your own switch.

path: 3erl-zero-injection
title: 3ERL Zero-Injection
icon: mdi:solar-power
type: sections
max_columns: 3
sections:
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: 3ERL Zero-Injection
        icon: mdi:solar-power

      # Status row
      - type: tile
        entity: select.3erl_zero_injection_zero_injection_mode
        name: Mode
        features:
          - type: select-options
      - type: tile
        entity: binary_sensor.3erl_zero_injection_curtailment_requested
        name: Curtailment requested
        # ACC contract? Use binary_sensor.3erl_zero_injection_cdc_curtailment_requested
        state_content:
          - state
          - last_changed
      - type: tile
        entity: binary_sensor.3erl_zero_injection_commanded_limitation
        name: Commanded limitation
        state_content:
          - state
          - last_changed
      - type: tile
        entity: binary_sensor.3erl_zero_injection_3erl_data_stale
        name: Data freshness
        state_content: state

      # Live figures
      - type: tile
        entity: sensor.3erl_zero_injection_current_pre
        name: Current PRE+
        # ACI contract? Use sensor.3erl_zero_injection_estimated_daily_pre
      - type: tile
        entity: sensor.3erl_zero_injection_daily_trend
        name: Daily trend

      # Manual controls and diagnostics
      - type: tile
        entity: sensor.3erl_zero_injection_last_rte_update
        name: Last update
      - type: tile
        entity: button.3erl_zero_injection_refresh_3erl_data
        name: Refresh 3ERL data
      - type: tile
        entity: switch.3erl_zero_injection_manual_bypass
        name: Manual bypass
      - type: tile
        entity: binary_sensor.3erl_zero_injection_relay_control_fault
        name: Relay control fault
      - type: tile
        entity: binary_sensor.3erl_zero_injection_grid_export_during_commanded_limitation
        name: Observed export during command
      - type: tile
        entity: switch.your_relay_switch
        name: Relay
        # <-- replace with your relay switch entity

  - type: grid
    cards:
      - type: heading
        heading: Timed overrides
        icon: mdi:timer-outline

      # The duration numbers hold the default duration used by the timed
      # services when duration is omitted. An explicit duration in the
      # service call overrides them (1–1440 minutes). Any manual change
      # (switch off, select change, another service call) cancels the timer.
      - type: tile
        entity: number.3erl_zero_injection_bypass_duration
        name: Bypass duration
        features:
          - type: numeric-input
      - type: tile
        entity: number.3erl_zero_injection_forced_mode_duration
        name: Forced mode duration
        features:
          - type: numeric-input
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: Timed bypass
            icon: mdi:pause-circle
            tap_action:
              action: perform-action
              perform_action: zero_inject_3erl.set_bypass
              data:
                enable: true
              confirmation:
                text: Suspend automatic control for the configured duration?
          - type: button
            name: Force On (timed)
            icon: mdi:power
            tap_action:
              action: perform-action
              perform_action: zero_inject_3erl.set_mode
              data:
                mode: "On"
              confirmation:
                text: Force On for the configured duration, then back to Auto?
          - type: button
            name: Force Off (timed)
            icon: mdi:power-off
            tap_action:
              action: perform-action
              perform_action: zero_inject_3erl.set_mode
              data:
                mode: "Off"
              confirmation:
                text: Force Off for the configured duration, then back to Auto?

  - type: grid
    column_span: 2
    cards:
      - type: history-graph
        title: Curtailment — last 24 h
        hours_to_show: 24
        entities:
          - entity: binary_sensor.3erl_zero_injection_curtailment_requested
            name: Requested
          - entity: binary_sensor.3erl_zero_injection_commanded_limitation
            name: Active
      - type: history-graph
        title: Diagnostics — last 24 h
        hours_to_show: 24
        entities:
          - entity: binary_sensor.3erl_zero_injection_3erl_data_stale
            name: Stale data
          - entity: binary_sensor.3erl_zero_injection_grid_export_during_commanded_limitation
            name: Observed export

  - type: grid
    cards:
      - type: history-graph
        title: PRE+ — last 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.3erl_zero_injection_current_pre
            name: Current
          - entity: sensor.3erl_zero_injection_latest_pre
            name: Latest (3ERL)

---
name: Create release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.2.0)
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job pushes the release commit and tag with the workflow token.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Update CHANGELOG.md and manifest.json
        id: bump
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/bump_version.py

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md custom_components/*/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(release): prepare v${VERSION}"
          fi
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "HEAD:${BRANCH}" --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--generate-notes --title "Release v${VERSION}")
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "v${VERSION}" "${args[@]}"

---
name: OSV-Scanner

"on":
  pull_request:
    branches: [main, dev]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"

permissions: {}

jobs:
  # Full audit of uv.lock. Results go to code scanning. Home Assistant pins
  # some dependencies exactly (for example cryptography and PyJWT), so known
  # issues there cannot be fixed here and must not block the default branch.
  scan-scheduled:
    name: Audit uv.lock
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=uv.lock
      fail-on-vuln: false

  # Fails only when a pull request introduces a new vulnerability.
  scan-pr:
    name: Audit uv.lock changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=uv.lock

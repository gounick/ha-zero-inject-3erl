---
name: Validate with hassfest

"on":
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: hassfest
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: hassfest
        uses: "home-assistant/actions/hassfest@master"

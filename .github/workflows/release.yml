---
name: Update changelog and manifest on release

"on":
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  update-changelog:
    name: Update CHANGELOG.md and manifest.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}
          # The job pushes the version bump with the workflow token.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Update CHANGELOG.md and manifest.json
        id: bump
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/bump_version.py

      - name: Commit and push
        env:
          TAG_NAME: v${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md custom_components/*/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(release): bump manifest and changelog for ${TAG_NAME}"
          git push

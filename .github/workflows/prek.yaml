---
name: Prek

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions: {}

jobs:
  prek:
    name: Run prek hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
